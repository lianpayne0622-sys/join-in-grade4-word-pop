<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#156b5b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="新版人教英语背诵"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="app-icon.svg"><title>新版人教七年级英语背诵</title><style>:root{--g:#156b5b;--ink:#18332f;--muted:#687b76;--line:#dfe9e4;--y:#ffd76d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#f5fbf7,#fffaf0);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px 14px 60px}header{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:18px}.ey{font-size:12px;letter-spacing:.16em;color:var(--g);font-weight:800}h1{font-family:Georgia,serif;font-size:clamp(34px,5vw,56px);line-height:1;margin:7px 0}.sub{color:var(--muted)}.stats{display:flex;gap:8px}.stat{background:#fff8e6;border:1px solid #f2dda1;border-radius:16px;padding:10px 14px;text-align:center;min-width:82px}.stat b{display:block;font-size:21px}.stat span{font-size:11px;color:var(--muted)}.tools{position:sticky;top:5px;z-index:4;background:#fffffff2;border:1px solid var(--line);border-radius:20px;padding:11px;display:flex;flex-wrap:wrap;gap:7px;box-shadow:0 12px 32px #1d473e15;backdrop-filter:blur(12px)}button,select,input{font:inherit;border:0;border-radius:10px;padding:10px 12px}button,select{background:#edf4f1;color:var(--ink);font-weight:700}button.active{background:var(--g);color:#fff}input{flex:1;min-width:170px;border:1px solid var(--line);background:#fff}.modes{display:flex;gap:6px;width:100%}.modes button{flex:1}.random{background:var(--y)}.count{font-size:13px;color:var(--muted);margin:14px 3px 8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 50px 17px 18px;min-height:130px}.tags{display:flex;gap:5px;margin-bottom:10px}.tag{background:#eef7f3;color:var(--g);border-radius:99px;padding:4px 8px;font-size:11px;font-weight:800}.en{font-family:Georgia,serif;font-size:22px;font-weight:700;margin-bottom:8px}.cn{color:#53645f;line-height:1.5}.cover{filter:blur(9px);user-select:none}.done{position:absolute;right:13px;top:13px;width:32px;height:32px;padding:0;background:#fff;border:1px solid var(--line);color:#9bada8;border-radius:50%}.done.yes{background:var(--g);color:#fff}.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:25px}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.stats{width:100%}.stat{flex:1}.grid{grid-template-columns:1fr}h1{font-size:38px}}</style></head><body><main class="wrap"><header><div><div class="ey">2024–2025 新版人教版</div><h1>七年级英语背诵卡</h1><div class="sub">七上＋七下 · 按册、单元复习</div></div><div class="stats"><div class="stat"><b id="shown">0</b><span>当前词汇</span></div><div class="stat"><b id="doneN">0</b><span>已掌握</span></div></div></header><section class="tools"><button class="kind active" data-kind="word">单词</button><button class="kind" data-kind="phrase">短句</button><button class="kind" data-kind="grammar">核心语法</button><button class="kind" data-kind="exam">必考知识点</button><div style="flex-basis:100%"></div><button class="book active" data-book="all">全部</button><button class="book" data-book="七上">七上</button><button class="book" data-book="七下">七下</button><select id="unit"><option value="all">全部单元</option></select><input id="q" placeholder="搜索英文或中文…"><button id="rand" class="random">↻ 随机</button><div class="modes"><button class="mode active" data-mode="show">全显示</button><button class="mode" data-mode="hide-cn">遮中文</button><button class="mode" data-mode="hide-en">遮英文</button></div></section><div id="count" class="count"></div><section id="grid" class="grid"></section><footer>点击模糊内容可揭示；掌握标记自动保存在本机。<br>词汇按新版教材单元整理，已排除多数人名等非重点专名。</footer></main><script src="vocab.js?v=6"></script><script src="study.js?v=6"></script><script>let kind="word",book="all",unit="all",mode="show",items=STUDY.slice();const mastered=new Set(JSON.parse(localStorage.getItem("vocabMastered")||"[]")),grid=document.getElementById("grid"),q=document.getElementById("q"),unitSel=document.getElementById("unit");function key(x){return x.kind+"|"+x.book+"|"+x.unit+"|"+x.en}function units(){let a=[...new Map(STUDY.filter(x=>x.kind===kind&&(book==="all"||x.book===book)).map(x=>[x.book+"|"+x.unit,x])).values()];unitSel.innerHTML='<option value="all">全部单元</option>'+a.map(x=>'<option value="'+x.book+"|"+x.unit+'">'+x.book+" "+x.unit+" · "+x.title+"</option>").join("");unit="all"}function render(){let s=q.value.trim().toLowerCase(),v=items.filter(x=>x.kind===kind&&(book==="all"||x.book===book)&&(unit==="all"||x.book+"|"+x.unit===unit)&&(x.en+" "+x.cn).toLowerCase().includes(s));grid.innerHTML=v.length?"":'<div class="empty">没有匹配内容</div>';v.forEach(x=>{let k=key(x),c=document.createElement("article");c.className="card";c.innerHTML='<div class="tags"><span class="tag">'+x.book+'</span><span class="tag">'+x.unit+'</span></div><button class="done '+(mastered.has(k)?"yes":"")+'">✓</button><div class="en '+(mode==="hide-en"?"cover":"")+'">'+x.en+'</div><div class="cn '+(mode==="hide-cn"?"cover":"")+'">'+x.cn+'</div>';c.querySelector(".done").onclick=()=>{mastered.has(k)?mastered.delete(k):mastered.add(k);localStorage.setItem("vocabMastered",JSON.stringify([...mastered]));render()};c.querySelectorAll(".cover").forEach(e=>e.onclick=()=>e.classList.remove("cover"));grid.append(c)});document.getElementById("shown").textContent=v.length;document.getElementById("doneN").textContent=mastered.size;document.getElementById("count").textContent="显示 "+v.length+" 项 · 本类共 "+STUDY.filter(x=>x.kind===kind).length+" 项"}document.querySelectorAll(".kind").forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll(".kind").forEach(x=>x.classList.toggle("active",x===b));units();render()});document.querySelectorAll(".book").forEach(b=>b.onclick=()=>{book=b.dataset.book;document.querySelectorAll(".book").forEach(x=>x.classList.toggle("active",x===b));units();render()});document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll(".mode").forEach(x=>x.classList.toggle("active",x===b));render()});unitSel.onchange=()=>{unit=unitSel.value;render()};q.oninput=render;document.getElementById("rand").onclick=()=>{items.sort(()=>Math.random()-.5);render()};units();render();if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js?v=6"));</script></body></html>
