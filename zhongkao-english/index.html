<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#156b5b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="中考英语必背卡"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="app-icon.svg"><title>中考英语必背卡</title><style>
:root{--g:#156b5b;--ink:#18332f;--muted:#667a75;--line:#dfe9e4;--yellow:#ffd76d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#f7fbf7,#fbfaf5 50%,#fff7dc);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;min-height:100vh}button,input{font:inherit}.shell{max-width:1120px;margin:auto;padding:24px 18px 60px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:20px}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--g);font-weight:800}h1{font-family:Georgia,serif;font-size:clamp(36px,6vw,60px);margin:7px 0 4px;line-height:1}.sub{color:var(--muted)}.stats{display:flex;gap:10px}.stat{min-width:92px;background:#fff9e8;border:1px solid #f3dda0;border-radius:17px;padding:12px;text-align:center}.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--muted)}.bar{position:sticky;top:8px;z-index:3;background:#fffffff0;border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;box-shadow:0 12px 32px #1d473e15;backdrop-filter:blur(10px)}button{border:0;border-radius:11px;padding:10px 13px;background:#edf4f1;color:var(--ink);font-weight:700}button.active{background:var(--g);color:#fff}.search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:11px;padding:10px 13px}.random{background:var(--yellow)}.modes{display:flex;gap:6px;width:100%}.modes button{flex:1}.count{margin:16px 3px 9px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:19px;padding:20px 52px 19px 20px;min-height:142px}.card:hover{border-color:#8cc7b6}.tag{display:inline-block;background:#eef7f3;color:var(--g);border-radius:99px;padding:5px 9px;font-size:12px;font-weight:800;margin-bottom:12px}.en{font-family:Georgia,serif;font-size:22px;font-weight:700;line-height:1.35;margin-bottom:8px}.cn{color:#53645f;line-height:1.55}.note{display:inline-block;margin-top:9px;background:#fff8dd;color:#7a641e;border-radius:8px;padding:6px 8px;font-size:13px}.cover{filter:blur(9px);user-select:none}.done{position:absolute;right:14px;top:14px;width:33px;height:33px;padding:0;border:1px solid var(--line);background:#fff;color:#9caeaa;border-radius:50%}.done.yes{background:var(--g);color:#fff}.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:28px}.empty{grid-column:1/-1;padding:50px;text-align:center;color:var(--muted)}@media(max-width:700px){.shell{padding:18px 12px 45px}.top{align-items:flex-start;flex-direction:column}.stats{width:100%}.stat{flex:1}.grid{grid-template-columns:1fr}.bar{top:5px}h1{font-size:39px}}
</style></head><body><main class="shell"><header class="top"><div><div class="eyebrow">RENJIAO · 中考冲刺</div><h1>英语必背卡</h1><div class="sub">每天 15 分钟，遮住一边，主动回忆。</div></div><div class="stats"><div class="stat"><b id="total">0</b><span>当前卡片</span></div><div class="stat"><b id="done">0</b><span>已掌握</span></div></div></header><section class="bar"><button class="kind active" data-kind="all">全部</button><button class="kind" data-kind="word">单词</button><button class="kind" data-kind="phrase">短句</button><button class="kind" data-kind="grammar">语法</button><input id="search" class="search" placeholder="搜索英文或中文…"><button id="random" class="random">↻ 随机排序</button><div class="modes"><button class="mode active" data-mode="show">全显示</button><button class="mode" data-mode="hide-cn">遮中文</button><button class="mode" data-mode="hide-en">遮英文</button></div></section><div id="count" class="count"></div><section id="grid" class="grid"></section><footer class="footer">点击被遮挡的内容可单独揭示；掌握标记会自动保存在本机。<br>依据人教版初中英语常见中考考点整理。</footer></main><script>
const data=[
["word","achieve","实现；达到","achieve one's dream 实现梦想"],["word","advice","建议（不可数名词）","a piece of advice 一条建议"],["word","afford","负担得起；抽得出时间","afford to do sth."],["word","allow","允许；准许","allow sb. to do sth."],["word","although","虽然；尽管","不可与 but 连用"],["word","avoid","避免","avoid doing sth."],["word","believe","相信；认为","believe in 信任"],["word","borrow","借入","borrow…from…"],["word","brave","勇敢的","bravely 副词"],["word","choice","选择","make a choice"],["word","continue","继续","continue to do / doing"],["word","develop","发展；培养","develop a habit"],["word","difference","不同；差异","make a difference"],["word","difficult","困难的","difficulty 名词"],["word","encourage","鼓励","encourage sb. to do sth."],["word","environment","环境","protect the environment"],["word","especially","尤其；特别","注意拼写"],["word","experience","经历；经验","经验作不可数名词"],["word","explain","解释；说明","explain sth. to sb."],["word","important","重要的","importance 名词"],["word","improve","提高；改善","improve English"],["word","instead","代替；反而","instead of + 名词/doing"],["word","knowledge","知识","不可数名词"],["word","possible","可能的","as soon as possible"],["word","practice","练习","practice doing sth."],["word","prepare","准备","prepare for…"],["word","promise","承诺；保证","promise to do sth."],["word","protect","保护","protect…from…"],["word","receive","收到","receive 不等于 accept"],["word","remember","记得","remember to do / doing"],["word","suggest","建议","suggest doing sth."],["word","successful","成功的","succeed / success"],["word","unless","除非；如果不","等于 if…not"],["word","valuable","有价值的","value 名词"],
["phrase","How often do you exercise?","你多久锻炼一次？","对频率提问"],["phrase","It is never too late to learn.","活到老，学到老。","too…to… 太……而不能……"],["phrase","Practice makes perfect.","熟能生巧。","谚语"],["phrase","Actions speak louder than words.","行动胜于言语。","谚语"],["phrase","Could you please help me?","请问你能帮我吗？","礼貌请求"],["phrase","What do you think of it?","你觉得它怎么样？","等于 How do you like it?"],["phrase","I am looking forward to hearing from you.","我期待收到你的来信。","look forward to doing"],["phrase","Thank you for your help.","谢谢你的帮助。","thank sb. for sth."],["phrase","We should try our best to protect the earth.","我们应尽最大努力保护地球。","try one's best to do"],["phrase","Reading can open up our eyes.","阅读可以开阔我们的眼界。","动名词作主语"],["phrase","The more you read, the more you learn.","你读得越多，学得越多。","the + 比较级，the + 比较级"],["phrase","There is no doubt that health comes first.","毫无疑问，健康第一。","There is no doubt that…"],["phrase","Everyone can make a difference.","每个人都能带来改变。","make a difference"],["phrase","I used to be afraid of speaking in public.","我过去害怕当众讲话。","used to do"],["phrase","Let's take action from now on.","让我们从现在开始行动。","take action"],["phrase","As far as I am concerned, teamwork is important.","在我看来，团队合作很重要。","写作观点句"],["phrase","On the one hand…, on the other hand…","一方面……，另一方面……","写作衔接句"],["phrase","In a word, good habits lead to success.","总之，好习惯通向成功。","写作总结句"],
["grammar","一般现在时：主语 + do/does","表示习惯、事实或经常性动作。","He goes to school by bike every day."],["grammar","一般过去时：主语 + 动词过去式","表示过去发生的动作或状态。","We visited the museum yesterday."],["grammar","一般将来时：will / be going to + 动词原形","表示将来的动作或计划。","I will call you tomorrow."],["grammar","现在进行时：am/is/are + doing","表示此刻或现阶段正在进行。","They are playing football now."],["grammar","现在完成时：have/has + 过去分词","过去动作对现在有影响，或持续到现在。","I have lived here for three years."],["grammar","被动语态：be + 过去分词","强调动作的承受者。","Tea is grown in Hangzhou."],["grammar","情态动词 + 动词原形","can、must、should、may 后用原形。","We should follow the rules."],["grammar","宾语从句：连接词 + 陈述语序","注意时态呼应；客观真理用一般现在时。","I wonder where he lives."],["grammar","定语从句：先行词 + who/which/that…","who 指人；which 指物；that 均可。","I like books that are interesting."],["grammar","条件状语从句：if + 一般现在时，主句 will + 原形","主将从现。","If it rains, we will stay at home."],["grammar","时间状语从句：when/as soon as/until…","主将从现。","I will tell him as soon as he arrives."],["grammar","比较级：A + be + 比较级 + than + B","两者比较；注意不规则变化。","Tom is taller than Jack."],["grammar","最高级：the + 最高级 + 范围","三者或以上比较。","She is the most careful student in our class."],["grammar","动词不定式：to + 动词原形","可作主语、宾语、目的状语等。","I study hard to pass the exam."],["grammar","动名词：doing","常跟在 enjoy、finish、practice、mind 后。","She enjoys reading."],["grammar","感叹句：What + 名词 / How + 形容词副词","判断中心词是名词还是形容词。","What a beautiful day! / How beautiful!"],["grammar","There be 句型：There is/are…","be 动词遵循就近原则。","There is a book and two pens on the desk."],["grammar","too…to… / enough to…","太……而不能…… / 足够……可以……","He is old enough to go to school."]];
const labels={word:"单词",phrase:"短句",grammar:"语法"};let kind="all",mode="show",items=data.slice();const mastered=new Set(JSON.parse(localStorage.getItem("mastered")||"[]"));const grid=document.getElementById("grid"),search=document.getElementById("search");function key(x){return x[0]+"|"+x[1]}function render(){const q=search.value.trim().toLowerCase(),v=items.filter(x=>(kind==="all"||x[0]===kind)&&x.join(" ").toLowerCase().includes(q));grid.innerHTML=v.length?"":'<div class="empty">没有找到匹配内容，换个关键词试试。</div>';v.forEach(x=>{const k=key(x),c=document.createElement("article");c.className="card";c.innerHTML='<span class="tag">'+labels[x[0]]+'</span><button class="done '+(mastered.has(k)?"yes":"")+'">✓</button><div class="en '+(mode==="hide-en"?"cover":"")+'">'+x[1]+'</div><div class="cn '+(mode==="hide-cn"?"cover":"")+'">'+x[2]+'</div>'+(x[3]?'<div class="note">'+x[3]+'</div>':"");c.querySelector(".done").onclick=()=>{mastered.has(k)?mastered.delete(k):mastered.add(k);localStorage.setItem("mastered",JSON.stringify([...mastered]));render()};c.querySelectorAll(".cover").forEach(e=>e.onclick=()=>e.classList.remove("cover"));grid.append(c)});document.getElementById("count").textContent="显示 "+v.length+" 张卡片 · 点击遮挡处可揭示";document.getElementById("total").textContent=v.length;document.getElementById("done").textContent=mastered.size}document.querySelectorAll(".kind").forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll(".kind").forEach(x=>x.classList.toggle("active",x===b));render()});document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll(".mode").forEach(x=>x.classList.toggle("active",x===b));render()});search.oninput=render;document.getElementById("random").onclick=()=>{items.sort(()=>Math.random()-.5);render()};render();if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js?v=3"));
</script></body></html>
